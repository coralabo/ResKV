[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ResKV"
version = "0.1.0"
description = "ResKV: residual-based channel-wise unstructured pruning for KV cache compression"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*.txt"]
authors = [{name = "ResKV authors"}]
dependencies = ["torch>=2.8,<2.9", "transformers>=4.57,<4.58", "ninja>=1.11", "accelerate>=1.0"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]
eval = ["rouge>=1.0", "jieba>=0.42", "setuptools>=77,<81"]

[project.urls]
Repository = "https://github.com/coralabo/ResKV"

[project.scripts]
reskv-benchmark = "benchmarks.inference:main"
reskv-kernels = "benchmarks.kernels:main"
reskv-evaluate = "evaluation.run:main"
reskv-score = "evaluation.score:main"
reskv-compare = "benchmarks.compare:main"

[tool.setuptools.packages.find]
include = ["reskv*", "benchmarks*", "evaluation*"]

[tool.setuptools.package-data]
reskv = ["csrc/*.cu", "csrc/*.cuh"]
evaluation = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires NVIDIA GPU and CUDA toolkit", "model: Transformers integration tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
